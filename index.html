<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Oedon</title>
  <meta name="description" content="Structured data, maintained and delivered.">
  <link rel="icon" href="favicon.ico" sizes="16x16 32x32 48x48">
  <link rel="apple-touch-icon" href="apple-touch-icon.png">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    :root { --fg: #1a1a1a; --bg: #fafafa; --muted: #666; --accent: #2d2d2d; }
    @media (prefers-color-scheme: dark) {
      :root { --fg: #e8e8e8; --bg: #111; --muted: #999; --accent: #ccc; }
    }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      color: var(--fg); background: var(--bg);
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      min-height: 100vh; padding: 2rem;
    }
    main { max-width: 480px; text-align: center; }
    h1 { font-size: 2rem; font-weight: 600; letter-spacing: -0.02em; margin-bottom: 0.75rem; }
    p { color: var(--muted); font-size: 1.05rem; line-height: 1.6; margin-bottom: 1.5rem; }
    a { color: var(--fg); }
    .stage {
      position: relative;
      width: 320px;
      height: 280px;
      margin: 0 auto 2rem;
    }
    .stage canvas { display: block; touch-action: none; }
    footer { position: fixed; bottom: 1.5rem; color: var(--muted); font-size: 0.8rem; }
    footer a { color: var(--muted); margin: 0 0.5rem; }
  </style>
  <script type="importmap">
  { "imports": { "three": "./assets/js/three.module.js" } }
  </script>
</head>
<body>
  <main>
    <div class="stage" id="stage">
      <canvas id="cubeCanvas"></canvas>
    </div>
    <h1>Oedon</h1>
    <p>Structured data, maintained and delivered.</p>
    <p><a href="mailto:kamil@oedon.dev">kamil@oedon.dev</a></p>
  </main>
  <footer>
    <a href="privacy.html">Privacy</a>
    <a href="terms.html">Terms</a>
  </footer>

  <script type="module">
    import * as THREE from 'three';

    const canvas = document.getElementById('cubeCanvas');
    const stage = document.getElementById('stage');
    const bg = getComputedStyle(document.documentElement).getPropertyValue('--bg').trim();
    const scene = new THREE.Scene();
    scene.background = new THREE.Color(bg === '#111' ? 0x111111 : 0xfafafa);

    const camera = new THREE.PerspectiveCamera(45, 320 / 280, 0.1, 100);
    camera.position.set(3.5, 2.5, 5);
    camera.lookAt(0, 0, 0);

    const renderer = new THREE.WebGLRenderer({ canvas, antialias: true });
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
    renderer.setSize(320, 280);

    const cubeGroup = new THREE.Group();
    scene.add(cubeGroup);

    const subSize = 0.94;
    const offset = 0.5;

    const positions = [
      [-offset, -offset, -offset], [offset, -offset, -offset],
      [-offset,  offset, -offset], [offset,  offset, -offset],
      [-offset, -offset,  offset], [offset, -offset,  offset],
      [-offset,  offset,  offset], [offset,  offset,  offset],
    ];

    const isDark = bg === '#111';
    const faceMat = new THREE.MeshBasicMaterial({
      color: isDark ? 0xe8e8e8 : 0x1a1d21,
      side: THREE.DoubleSide
    });
    const edgeMat = new THREE.LineBasicMaterial({
      color: isDark ? 0x111111 : 0xffffff,
      transparent: true, opacity: 0.9
    });

    positions.forEach(([x, y, z]) => {
      const geo = new THREE.BoxGeometry(subSize, subSize, subSize);
      const mesh = new THREE.Mesh(geo, faceMat);
      mesh.position.set(x, y, z);
      cubeGroup.add(mesh);

      const edges = new THREE.EdgesGeometry(geo);
      mesh.add(new THREE.LineSegments(edges, edgeMat));

      const cornerGeo = new THREE.BufferGeometry();
      const s = subSize / 2;
      cornerGeo.setAttribute('position', new THREE.BufferAttribute(new Float32Array([
        -s,-s,-s, s,-s,-s, s,s,-s, -s,s,-s, -s,-s,s, s,-s,s, s,s,s, -s,s,s
      ]), 3));
      mesh.add(new THREE.Points(cornerGeo, new THREE.PointsMaterial({
        color: isDark ? 0x111111 : 0xffffff, size: 0.06, sizeAttenuation: true
      })));
    });

    const shadow = new THREE.Mesh(
      new THREE.PlaneGeometry(2.8, 2.8),
      new THREE.MeshBasicMaterial({ color: isDark ? 0xffffff : 0x000000, transparent: true, opacity: 0.06 })
    );
    shadow.rotation.x = -Math.PI / 2;
    shadow.position.y = -2.0;
    scene.add(shadow);

    const clock = new THREE.Clock();
    function animate() {
      requestAnimationFrame(animate);
      const t = clock.getElapsedTime();
      cubeGroup.position.y = Math.sin(t * 1.4) * 0.25;
      cubeGroup.rotation.y = t * 0.55;
      cubeGroup.rotation.x = Math.sin(t * 0.35) * 0.1;
      cubeGroup.rotation.z = Math.cos(t * 0.22) * 0.04;
      const h = cubeGroup.position.y;
      shadow.scale.setScalar(Math.max(0.65, 1 - (h + 0.25) * 0.12));
      shadow.material.opacity = Math.max(0.02, 0.08 - (h + 0.25) * 0.1);
      renderer.render(scene, camera);
    }
    animate();
  </script>
</body>
</html>
